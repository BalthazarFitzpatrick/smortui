[project]
name = "ui-base"
version = "0.1.10"
description = "the shared web interface for these tools: menus, tabs, sliders, pan/zoom, alignment"
# 3.11, matching the oldest consumer. nothing here needs anything newer - it is
# path handling and file reads - and a floor above a consumer's makes the package unusable there
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ui_base"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = ["ruff>=0.11.0", "pytest>=8.0"]
