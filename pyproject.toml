[project]
name = "ui-base"
version = "0.2.6"
description = "the shared web interface for these tools: menus, tabs, sliders, pan/zoom, alignment"
# 3.11, matching the oldest consumer. nothing here needs anything newer - it is
# path handling and file reads - and a floor above a consumer's makes the package unusable there
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ui_base"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # line too long - the formatter owns it
]

[tool.ruff.lint.isort]
known-first-party = ["ui_base"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["ruff>=0.11.0", "pytest>=8.0"]
# tests/test_demo.py (the demo in headless chromium) and tools/shoot_readme_images.py; CI syncs it
shots = ["playwright>=1.45"]
