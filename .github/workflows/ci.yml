# the linux runner and the oldest python the package claims (nothing local runs 3.11); CI=true
# turns the node and browser tests from skip-if-missing into failures
name: ci

on:
  push:
    # development is where tags are cut, so a tagged commit is one CI has run on
    branches: [main, development]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # fail-fast off: when 3.11 breaks and 3.14 does not, the interesting information is that only
      # one of them broke, which a cancelled sibling job hides
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # the scripts' behaviour tests run under node; a runner without it would skip them all
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: sync
        run: uv sync --dev --group shots --python ${{ matrix.python }}

      # the whole-system test drives the demo in headless chromium (tests/test_demo.py)
      - name: chromium
        run: uv run playwright install --with-deps chromium

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: pytest
        run: uv run pytest -q
