# the linux runner, and the OLDEST python the package claims to support, which nothing local runs:
# declaring >=3.11 while only ever testing 3.14 is an aspiration, not a fact. CI=true also turns the
# node-dependent tests from "skip if node is missing" into a failure, so half the suite cannot go
# quietly missing here.
name: ci

on:
  push:
    # development is where tags are cut, so a tagged commit is one CI has run on
    branches: [main, development]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # fail-fast off: when 3.11 breaks and 3.14 does not, the interesting information is that only
      # one of them broke, which a cancelled sibling job hides
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # the scripts' behaviour tests run under node; a runner without it would skip them all
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: sync
        run: uv sync --dev --python ${{ matrix.python }}

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: pytest
        run: uv run pytest -q
